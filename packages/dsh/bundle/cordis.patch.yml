# The mstar profile-bundle patch: inserts the mstar plugin row AND the mstar
# MCP client row over the dsh-base layer (profile `dsh.profile.bundles` order —
# dsh-base first, this bundle after the web-app layer; later layers win per
# row).
#
# A patch replaces the targeted row's whole `config` rather than merging into
# it, so a user-level override must restate every field it keeps (see
# bundle/README.md). The rows ship only neutral defaults: deployment-owned
# fields (harnessDir, enforcement, dispatchTools, dispatchBinding, skillRoots,
# bundledSkillDir) stay unset — the plugin resolves its OWN packaged
# `harness-skills/` mirror (synced by `bundle-assets`) package-relative, so no
# cwd-anchored default is needed. An absolute `bundledSkillDir` override in
# the profile layer still wins when a deployment wants a different mirror.
#
# The `mstar-mcp` row launches the host-neutral MCP server
# (`npx @mstar-harness/cli mcp`, stdio) through Cordis's `mcp-client` bridge.
# It requires the `@deepseek-ai/dsh-mcp-client` plugin in the profile's
# dependencies (`dsh plugin --profile web add @deepseek-ai/dsh-mcp-client`);
# app-boot tolerates the row failing to load without the plugin, in which case
# no mstar MCP tools appear and `mstar-harness doctor --target dsh` reports
# the mismatch.
#
# Mount contract: a deployment that needs a pinned root or a declared identity
# launches the server with `mstar mcp --harness <absolute path>` and/or
# `--identity-env <NAME>`. The pinned root is the server-owned DEFAULT for
# every registered command's root selection: a command that declares a
# per-call `harness` accepts an explicit override, while the `persist` family
# always uses the invocation's server root (the pin, or the cwd probe when
# unpinned) and takes no per-call harness. The declared identity is the
# connection's identity channel, and declaring it LOCKS the connection: the
# tools publish no session selector and a caller-supplied sessionId is
# stripped before admission (ADR dsh-native-identity-channels), so
# per-caller identity is a per-mount fact — each caller's row carries its own
# `--identity-env`. A connection without the flag keeps the generic behavior
# (a per-call sessionId selects the identity). The pin ALSO anchors the
# invocation workspace at
# the pinned root's parent, so a command that derives paths from its working
# directory (e.g. `audit.scaffold` deriving `{REVIEW_DIR}` without
# `--reviews-dir`) writes under the pinned harness, not the launch cwd.
# The shipped row keeps neutral defaults: no path, no identity declared. An
# override restates the row's whole `config`, including the `args` list.

- insert:
    - id: mstar
      name: '@mstar-harness/dsh'
      config: {}
    - id: mstar-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: mstar
        transport: stdio
        command: npx
        args: ['-y', '@mstar-harness/cli', 'mcp']
