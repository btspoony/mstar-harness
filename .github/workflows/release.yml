name: Release

# PR-driven release. Merging a `release vX.Y.Z` PR runs the whole release inline
# on the pull_request event: validate -> build -> npm publish (provenance) of
# @mstar-harness/engine + @mstar-harness/cli + @mstar-harness/opencode +
# @mstar-harness/opencode-v2 + @mstar-harness/dsh + @mstar-harness/omp
# (dependency order).
#
# @mstar-harness/commands is internal: it is a workspace devDependency inlined
# into the CLI bundle, never published to npm. It carries the release version in
# lockstep but has no publish step.
#
# Prereleases: a `release vX.Y.Z-alpha.N` PR publishes under the npm dist-tag
# `alpha` (never `latest`) and creates a GitHub Release flagged prerelease.
# INSTALL.md stays on the last stable release for prerelease lines.
#
# No secrets are required for the default flow (the tag is pushed with the
# workflow's GITHUB_TOKEN). Releases are PR-driven by design: this workflow has
# NO manual entry point — dispatching a branch's copy of a workflow that holds
# `id-token: write` + `contents: write` could publish an unmerged tree, so the
# publish path is reachable only through a merged `release vX.Y.Z` PR.
# A release that fails after some packages published is recovered by preparing
# the next patch release (`bun run release:prepare -- --patch`), which publishes
# the remaining packages under the new version; the preflight below always skips
# a version that is already on the registry.
#
# NOTE: npm trusted publishing / provenance now runs on the pull_request event
# instead of push:tags. The workflow filename (`.github/workflows/release.yml`)
# is unchanged. If the first release via this flow fails publish, provenance
# trust may need the trigger reverted to push:tags (see git history).

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: >
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.title, 'release v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      # Node 24.18 is the issue-store runtime floor and ships npm with working
      # Trusted Publishing / provenance (sigstore). Do not `npm install -g npm@latest`
      # over the setup-node-managed npm — that breaks provenance with MODULE_NOT_FOUND: sigstore.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - name: Resolve version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Resolve npm dist-tag
        id: disttag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then TAG="alpha"; else TAG="latest"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION} under dist-tag ${TAG}"

      - name: Validate release versions
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bun run release:validate -- "v${VERSION}"

      - name: Typecheck
        run: bun run typecheck

      - name: Build packages
        run: |
          bun run --cwd packages/commands build
          bun run cli:build
          bun run opencode:build
          bun run opencode-v2:build
          bun run dsh:build
          bun run omp:build
      # Decide the publish set once, before anything is published. It refuses
      # on any unknown registry state, so a version that already exists on the
      # registry is skipped explicitly instead of failing at the publish step.
      # It checks manifest publishability and registry state only — it cannot
      # verify npm trusted-publisher/OIDC authorization, which only an actual
      # publish attempt proves, so a step can still fail on authorization
      # afterwards.
      - name: Preflight publish set
        id: preflight
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bun run scripts/release-preflight.ts "$VERSION"

      # Each publish step guards on that preflight result: a version listed in
      # `skip` is already on the registry (npm rejects a duplicate), so its step
      # becomes a reported no-op instead of a failure.
      - name: Publish @mstar-harness/engine
        run: |
          case " ${{ steps.preflight.outputs.skip }} " in
            *" @mstar-harness/engine "*) echo "@mstar-harness/engine ${{ steps.ver.outputs.version }} is already on the registry; skipping." ;;
            *) npm publish --workspace @mstar-harness/engine --access public --tag ${{ steps.disttag.outputs.tag }} ;;
          esac

      - name: Publish @mstar-harness/cli
        run: |
          case " ${{ steps.preflight.outputs.skip }} " in
            *" @mstar-harness/cli "*) echo "@mstar-harness/cli ${{ steps.ver.outputs.version }} is already on the registry; skipping." ;;
            *) npm publish --workspace @mstar-harness/cli --access public --tag ${{ steps.disttag.outputs.tag }} ;;
          esac

      - name: Publish @mstar-harness/opencode
        run: |
          case " ${{ steps.preflight.outputs.skip }} " in
            *" @mstar-harness/opencode "*) echo "@mstar-harness/opencode ${{ steps.ver.outputs.version }} is already on the registry; skipping." ;;
            *) npm publish --workspace @mstar-harness/opencode --access public --tag ${{ steps.disttag.outputs.tag }} ;;
          esac

      - name: Publish @mstar-harness/opencode-v2
        run: |
          case " ${{ steps.preflight.outputs.skip }} " in
            *" @mstar-harness/opencode-v2 "*) echo "@mstar-harness/opencode-v2 ${{ steps.ver.outputs.version }} is already on the registry; skipping." ;;
            *) npm publish --workspace @mstar-harness/opencode-v2 --access public --tag ${{ steps.disttag.outputs.tag }} ;;
          esac

      - name: Publish @mstar-harness/dsh
        run: |
          case " ${{ steps.preflight.outputs.skip }} " in
            *" @mstar-harness/dsh "*) echo "@mstar-harness/dsh ${{ steps.ver.outputs.version }} is already on the registry; skipping." ;;
            *) npm publish --workspace @mstar-harness/dsh --access public --tag ${{ steps.disttag.outputs.tag }} ;;
          esac

      - name: Publish @mstar-harness/omp
        run: |
          case " ${{ steps.preflight.outputs.skip }} " in
            *" @mstar-harness/omp "*) echo "@mstar-harness/omp ${{ steps.ver.outputs.version }} is already on the registry; skipping." ;;
            *) npm publish --workspace @mstar-harness/omp --access public --tag ${{ steps.disttag.outputs.tag }} ;;
          esac

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create + push tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping tag creation."
            exit 0
          fi
          git tag -a -m "Release ${TAG}" "$TAG"
          git push origin "$TAG"

      # The Release body is capped by GitHub at 125000 characters; a large
      # release line exceeds it, so truncate with a pointer to CHANGELOG.md.
      - name: Extract changelog notes
        id: changelog
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release-notes-${VERSION}.md"
          bun run scripts/extract-changelog-section.ts "$VERSION" --max-bytes 120000 > "$NOTES_FILE"
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
