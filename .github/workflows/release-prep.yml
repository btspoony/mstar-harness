name: Release prep

# The "New release" entry point. Trigger manually from Actions → "Release prep"
# → Run workflow (optionally pass an explicit X.Y.Z). It assembles changelog
# fragments, bumps every surface, validates the build, and opens a
# `release vX.Y.Z` PR. Merging that PR runs the Release workflow's `tag` job,
# which pushes the tag and triggers publish.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target version (e.g. 1.8.7, or a prerelease like 1.9.0-alpha.0). Leave empty for an auto patch bump."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-prep
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install

      - name: Reject already-released version
        id: want
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="auto"; fi
          if [ "$V" != "auto" ] && git rev-parse "v$V" >/dev/null 2>&1; then
            echo "::error::Tag v$V already exists."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Assemble fragments + bump surfaces
        run: |
          V="${{ steps.want.outputs.version }}"
          if [ "$V" = "auto" ]; then
            bun run release:prepare -- --patch
          else
            bun run release:prepare -- "$V"
          fi

      - name: Resolve resulting version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Validate release surfaces
        run: bun run release:validate -- "v${{ steps.ver.outputs.version }}"

      - name: Build engine (declarations for typecheck)
        run: bun run engine:build

      - name: Typecheck + pack (release sanity)
        run: |
          mkdir -p /tmp/pack-out
          bun run typecheck
          npm pack --workspace @mstar-harness/cli --pack-destination /tmp/pack-out
          npm pack --workspace @mstar-harness/opencode --pack-destination /tmp/pack-out

      - name: Extract release notes
        run: bun run scripts/extract-changelog-section.ts "${{ steps.ver.outputs.version }}" > /tmp/notes.md

      - name: Commit prepared release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="release/v${{ steps.ver.outputs.version }}"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(release): prepare v${{ steps.ver.outputs.version }}"
          git push --force-with-lease origin "$BRANCH"

      - name: Ensure release label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create release --if-not-exists --color 0E8A16 || true

      - name: Open or update release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          BRANCH="release/v${VERSION}"
          TITLE="release v${VERSION}"
          {
            echo "Generated by the **Release prep** workflow."
            echo
            echo "Merging this PR tags v${VERSION} (auto), publishes @mstar-harness/engine + @mstar-harness/cli + @mstar-harness/opencode, and creates the GitHub Release."
            echo
            echo "## Changelog"
            echo
            cat /tmp/notes.md
          } > /tmp/pr-body.md
          OPEN=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh pr edit "$OPEN" --title "$TITLE" --body-file /tmp/pr-body.md
            echo "Updated existing release PR #$OPEN"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" \
              --body-file /tmp/pr-body.md --label release
          fi
