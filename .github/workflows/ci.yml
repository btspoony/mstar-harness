name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*"
    paths:
      - "packages/engine/**"
      - "packages/cli/**"
      - "packages/opencode/**"
      - "packages/dsh/**"
      - "scripts/**"
      - "skills/**"
      - "agents/**"
      - "commands/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "packages/engine/**"
      - "packages/cli/**"
      - "packages/opencode/**"
      - "packages/dsh/**"
      - "scripts/**"
      - "skills/**"
      - "agents/**"
      - "commands/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "tsconfig.json"
      - ".github/workflows/ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install

      - name: OpenCode dep tree (no commander/inquirer)
        run: |
          TREE="$(npm ls --workspace @mstar-harness/opencode 2>&1)" || {
            echo "::error::npm ls failed for @mstar-harness/opencode (unresolved dep tree)"
            echo "$TREE"
            exit 1
          }
          echo "$TREE"
          if echo "$TREE" | bun run ci:dep-guard; then
            echo "OK — opencode dep tree has no commander/inquirer"
          else
            echo "::error::@mstar-harness/opencode dep tree must not contain commander or inquirer (roadmap §8.7 item 5)"
            exit 1
          fi

      # Root typecheck resolves @mstar-harness/engine via packages/engine/dist
      # (types: ./dist/index.d.ts), which is gitignored — build it first.
      # The engine build is idempotent (rm -rf dist && bun build && bunx tsc).
      - name: Build engine (declarations for typecheck)
        run: bun run engine:build

      - name: Typecheck
        run: bun run typecheck

      - name: Build CLI
        run: bun run cli:build

      - name: Build OpenCode
        run: bun run opencode:build

      # dsh build resolves @mstar-harness/engine via packages/engine/dist —
      # must run after "Build engine". The dsh prepare script also builds the
      # engine when run inside the monorepo (bun workspace install), so a plain
      # `bun install` in a fresh checkout is self-sufficient.
      - name: Build dsh
        run: bun run dsh:build

      - name: CLI smoke check
        run: bun run --cwd packages/cli check

      - name: Test engine
        run: bun run --cwd packages/engine test

      # The cli test script runs the engine build as a pre-step (tests import
      # @mstar-harness/engine dist) — use the package script, not raw bun test.
      - name: Test CLI
        run: bun run --cwd packages/cli test

      - name: Test OpenCode
        run: bun run --cwd packages/opencode test

      # The dsh test imports @mstar-harness/engine dist (built above) and
      # needs the harness-skills/harness-commands mirrors (synced by
      # postinstall's dsh:bundle-assets) — use the package script. Dev-time
      # the dsh seam packages come from a local dsh source tree via the link
      # farm (packages/dsh/scripts/setup-dsh-links.ts); CI has no dsh tree
      # (dsh is not run in CI — user-confirmed), so the dsh steps are gated on
      # availability by the marker step below.
      - name: Detect dsh source tree (link-farm availability)
        id: dsh-tree
        run: |
          if [ -n "${DSH_SOURCE_DIR:-}" ] && [ -d "$DSH_SOURCE_DIR" ]; then
            echo "dsh_available=true"
          elif [ -d "${HOME}/.dsh/source/current" ]; then
            echo "dsh_available=true"
          else
            echo "dsh_available=false"
            echo "::warning::no dsh source tree (\$DSH_SOURCE_DIR / ~/.dsh/source/current) — skipping dsh test/typecheck steps (dsh is not run in CI)"
          fi

      - name: Test dsh
        if: steps.dsh-tree.outputs.dsh_available == 'true'
        run: |
          bun run --cwd packages/dsh dsh:link
          bun run --cwd packages/dsh test

      # The export-surface type layer (value-namespace identity + type-only
      # probes + cordis augmentation) is enforced by tsc over the tests —
      # bun test alone never typechecks the spec.
      - name: Typecheck dsh tests
        if: steps.dsh-tree.outputs.dsh_available == 'true'
        run: bun run --cwd packages/dsh typecheck:tests

      - name: Test scripts
        run: bun test scripts/prepare-release.test.ts scripts/ci-dep-guard.test.ts

      - name: Pack CLI tarball
        run: bun run cli:pack

      - name: Pack OpenCode tarball
        run: bun run opencode:pack

  # Roadmap §8.7 item 2 (risk R2): skills must load without the engine.
  # Deliberately NO `bun install` — this job runs in a checkout where
  # @mstar-harness/engine and @mstar-harness/cli are not installed, and the
  # script asserts no skill references them in its load order (advisory
  # "Engine check" callouts only).
  standalone-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17

      - name: Standalone smoke (engine + cli uninstalled)
        run: bun run validation:standalone

  # Roadmap §8.7 item 4 (risk R1): pointer callouts in skills/ must reference
  # real engine exports + real CLI subcommands, and engine spec-citation
  # comments must resolve to real skill files.
  drift-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17

      - name: Pointer drift lint (callouts ↔ engine exports + CLI commands)
        run: bun run validation:drift
