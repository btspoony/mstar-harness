          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18"

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - name: Install dependencies
        run: bun install

      # The commands tests import the engine and judgment dist plus the
      # package's own built index, and spawn the real CLI entry whose graph
      # needs the generated dashboard module; the CLI build also builds the
      # commands package, so this chain covers every prerequisite.
      - name: Build prerequisites (engine, judgment, CLI + commands)
        run: bun run engine:build && bun run judgment:build && bun run cli:build

      - name: Test commands
        run: bun run --cwd packages/commands test

  test-judgment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18"

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - name: Install dependencies
        run: bun install

      # The judgment specs resolve the engine dist through the workspace
      # devDependency — build engine + judgment dist before running the suite.
      - name: Build engine and judgment dist
        run: bun run engine:build && bun run judgment:build

      # The shadow-supervisor container-only cases bypass Docker via their test
      # launcher and append the probe denial log to /mnt/output on the runner
      # host; pre-create it runner-writable so those cases run instead of
      # skipping. The suite's capability guard fails this job if it is absent.
      - name: Provide /mnt/output for the container-only judgment cases
        run: sudo install -d -o "$(id -un)" -g "$(id -gn)" /mnt/output

      - name: Test judgment
        run: bun run --cwd packages/judgment test

  lint-scripts-hooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18"

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - name: Install dependencies
        run: bun install

      # hooks/src specs and scripts/build-zcode-hooks.test.ts call
      # buildZcodeHooks(), which bundles hooks/src/mstar-write-gate.ts with the
      # engine inlined — the engine dist must exist for that resolution.
      - name: Build engine (dist for the hooks/scripts specs)
        run: bun run engine:build && bun run judgment:build

      # The ASCII lint below scans packages/cli/src recursively, so the
      # single-job pipeline always linted the generated dashboard module (the
      # CLI build ran before the lint). Build the CLI here so this job scans the
      # exact same file set — dropping it would silently narrow the lint.
      - name: Build CLI (generated dashboard module for the ASCII lint scan)
        run: bun run cli:build

      - name: Test scripts
        run: bun test scripts/ascii-literal-utils.test.ts scripts/build-zcode-hooks.test.ts scripts/ci-dep-guard.test.ts scripts/ci-packed-manifest-guard.test.ts scripts/drift-lint.test.ts scripts/escape-dist-literals.test.ts scripts/lint-ascii-literals.test.ts scripts/lint-refusal-quality.test.ts scripts/lint-help-reachability.test.ts scripts/lint-overdesign-backtest.test.ts scripts/prepare-release.test.ts

      # ZCode write-gate source tests: spawn the TS entry with synthetic
      # PreToolUse stdin fixtures (engine dist is built above).
      - name: Test hooks source
        run: bun test hooks/src

      # spec §7.4: src code literals must stay pure ASCII — bun 1.2.17
      # misdecodes raw multi-byte UTF-8 in literals of the 366KB CLI bundle.
      # Scans packages/{engine,cli}/src + hooks/src only (no build needed).
      - name: Lint ASCII literals (src code)
        run: bun run lint:ascii-literals
      # Hash gates has 49 pre-existing frozen-rule violations on main — tracked
      # as #424; flip to blocking when it closes (triage → fix → main clean).
      - name: Lint hash gates
        continue-on-error: true
        run: bun run lint:hash-gates

      - name: Lint refusal quality
        run: bun run lint:refusal-quality

      - name: Lint help reachability
        run: bun run lint:help-reachability

  pack-consumers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18"

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - name: Install dependencies
        run: bun install

      # Both packs ship the package `files` list (dist + mirrors), so the built
      # artifacts must exist before `npm pack`. Both builds inline the engine
      # dist — build that first.
      - name: Build engine (dist for the consumer builds)
        run: bun run engine:build && bun run judgment:build
      - name: Build commands package
        run: bun run --cwd packages/commands build

      - name: Build CLI
        run: bun run cli:build

      - name: Build OpenCode
        run: bun run opencode:build

      - name: Pack CLI tarball
        run: bun run cli:pack

      - name: Pack OpenCode tarball
        run: bun run opencode:pack

      # The root package.json is the manifest git/hosted installs resolve
      # (`omp plugin install github:…`, `bun add github:…`): a `workspace:`
      # spec in a shipped dependency section breaks every hosted install at
      # resolve time (20260829 hotfix). Guard raw + packed root manifests.
      - name: "Packed manifest guard (no workspace: in shipped deps)"
        run: bun run ci:packed-manifest-guard

  # Roadmap §8.7 item 2 (risk R2): skills must load without the engine.
  # Deliberately NO `bun install` — this job runs in a checkout where
  # @mstar-harness/engine and @mstar-harness/cli are not installed, and the
  # script asserts no skill references them in its load order (advisory
  # "Engine check" callouts only).
  standalone-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Standalone smoke (engine + cli uninstalled)
        run: bun run validation:standalone

  # Roadmap §8.7 item 4: pointer callouts and tracked Markdown links/anchors
  # must resolve against the current repository corpus.
  drift-lint:
    runs-on: ubuntu-latest
    steps:
      # Full history is required: Guard 2 (README bilingual pairing) resolves
      # its range via `git merge-base origin/main HEAD` — a shallow
      # fetch-depth: 1 checkout has no origin/main ref and the guard would
      # (correctly, per its CI contract) fail loudly instead of running.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies for drift validation
        run: bun install --frozen-lockfile
      - name: Build engine and command workspace dependencies
        run: bun run engine:build && bun run judgment:build && bun run --cwd packages/commands build


      - name: Repository drift validation
        run: bun run validation:drift
